<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Subtle Internal Border -->
  <rect x="36" y="36" width="440" height="440" rx="124" stroke="rgba(255,255,255,0.3)" stroke-width="6" fill="none" />

  <!-- Medical Cross and Dynamic Pulse Ring -->
  <circle cx="256" cy="256" r="140" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-dasharray="12 12" />
  
  <!-- Pulse Line Graphic -->
  <path d="M 120 256 L 190 256 L 220 180 L 260 330 L 295 215 L 325 256 L 392 256" 
        stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Orbiting Health Shield Node -->
  <circle cx="392" cy="160" r="28" fill="#34d399" stroke="#ffffff" stroke-width="6" />
</svg>
